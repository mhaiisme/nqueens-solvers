[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nqueens-solvers"
version = "1.0.0"
description = "N-Queens Problem Solving with SAT (AMO/ALO), Constraint Programming, and Integer Linear Programming"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-sat>=1.9.dev15",
    "ortools>=9.10.0",
    "gurobipy>=11.0.0",
    "docplex>=2.28.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
nqueens = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nqueens*"]
